[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomalib-trainer"
version = "0.1.0"
description = "Windows desktop UI for PatchCore training with Anomalib"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
	"anomalib_smoke: real Anomalib train, export, reload, and parity integration tests",
]

